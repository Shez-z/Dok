<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай число — игра с рекордами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Угадай число!</h1>
        
        <div class="game-section">
            <div class="input-group">
                <label for="playerName">Ваше имя:</label>
                <input type="text" id="playerName" placeholder="Введите ваше имя">
            </div>
            
            <div class="input-group">
                <label for="guessInput">Угадайте число:</label>
                <input type="number" id="guessInput" placeholder="От 1 до 5000">
                <button id="checkBtn">Проверить</button>
            </div>
            
            <div id="hint" class="hint"></div>
            <div id="attempts" class="attempts">Попыток: 0</div>
            
            <button id="newGameBtn">Новая игра</button>
            <button id="dayNumberBtn">Число дня (10–50 попыток)</button>
        </div>
        
        <div class="records-section">
            <h2>Таблица рекордов</h2>
            <button id="clearRecordsBtn">Очистить рекорды</button>
            <table id="recordsTable">
                <thead>
                    <tr>
                        <th>Место</th>
                        <th>Имя</th>
                        <th>Попытки</th>
                    </tr>
                </thead>
                <tbody id="recordsBody"></tbody>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
